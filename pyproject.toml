[project]
name = "jth-recsys"
version = "0.1.0"
description = "IIC3633 final project: job recommendation on the JTH dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.11.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jth"]
